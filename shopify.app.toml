# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "14dfbcbee2e84a15b6f5b9a12f8ebadc"
name = "Shomer Shabbat"
application_url = "https://kalanit-shomer-shabat.vercel.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_themes"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [
  "https://kalanit-shomer-shabat.vercel.app/auth/callback",
  "https://kalanit-shomer-shabat.vercel.app/auth/shopify/callback",
  "https://kalanit-shomer-shabat.vercel.app/api/auth/callback"
]

[app_proxy]
url = "https://kalanit-shomer-shabat.vercel.app/apps/shomer-shabbat"
prefix = "apps"
subpath = "shomer-shabbat"

[build]
automatically_update_urls_on_dev = true
